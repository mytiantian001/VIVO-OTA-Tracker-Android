# Release 在推送 v* 标签时自动构建 Release APK 并发布 GitHub Release。
# 签名为可选项：
#   在仓库 Settings → Secrets and variables → Actions 配置以下 4 个 Secret 即可获得签名 APK：
#     KEYSTORE_BASE64   签名库文件 keystore.jks 的 base64（base64 -w0 keystore.jks）
#     KEYSTORE_PASS     签名库密码
#     KEY_ALIAS         key 别名
#     KEY_PASSWORD      key 密码
#   未配置时仍会构建并发布未签名的 Release APK（用于测试安装需允许未知来源）。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # versionCode 依赖 git rev-list --count HEAD，需要完整提交历史
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"
            echo "Keystore decoded from secret."
          else
            echo "KEYSTORE_BASE64 not set, building UNSIGNED release."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:android:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vivo-ota-tracker-release-apk
          path: app/android/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/android/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
